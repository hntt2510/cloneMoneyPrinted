name: CI
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Remotion install
        run: npm --prefix remotion ci

      - name: Remotion typecheck
        run: npm --prefix remotion run typecheck

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Python compile check
        run: .venv\Scripts\python.exe -m compileall app test

      - name: Dependency lock check
        run: uv lock --check

      - name: Run full test suite
        run: .venv\Scripts\python.exe -m unittest discover -s test
        env:
          PYTHONIOENCODING: "utf-8"

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Remotion install
        run: npm --prefix remotion ci

      - name: Remotion typecheck
        run: npm --prefix remotion run typecheck

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Python compile check
        run: .venv/bin/python -m compileall app test

      - name: Dependency lock check
        run: uv lock --check

      - name: Run full test suite
        run: .venv/bin/python -m unittest discover -s test
        env:
          PYTHONIOENCODING: "utf-8"
